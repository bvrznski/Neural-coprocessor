[MGPU]
; ===========================================================================
; MGPU Bridge 0.2.0 - THE DEFAULT. One file, every title.
;
; This is the shipping configuration. It arms itself, runs until you quit,
; and writes a summary at the end so a run can be read without watching it.
;
; ---- INSTALL LAYOUT. READ THIS ONE. ----
;
; nvngx_dlssnr.dll MUST NOT sit beside the game executable. Put it in a
; subfolder next to the add-on:
;
;     <game exe folder>\mgpu\nvngx_dlssnr.dll
;
; Proven 2026-09-13: with that DLL beside the executable, the title's own
; Streamline scans the folder, loads it, and binds NGX to the GAME'S GPU
; before this add-on's thread exists. CreateFeature on the second adapter
; then faults inside NVIDIA's allocator and takes the process down. The
; title never wanted that DLL - 0.1.0's install instructions put it there.
;
; The panel says INSTALL PROBLEM if it finds a copy beside the exe. Believe
; it. Any subfolder name works, but mgpu is the documented one.
;
; mgpu_depth_tap.fx goes in ReShade's Shaders folder. The add-on switches it
; on itself, so nothing needs enabling in the effects list. Depth=1 below
; needs it: without it ReShade never binds a depth buffer and the bridge
; waits instead of arming. ReShade.log says TAP = ABSENT when it is missing.
;
; ---- WHAT IS DELIBERATELY OFF ----
;
; Reflex and Auto are deferred to 0.3.0. Both work, neither is proven on a
; second machine, and a release whose headline is "the crash is gone" does
; not need two experiments riding along.
;
; Super resolution on the second card IS on - see SRScale below.
; ===========================================================================

; ---- transport ----
Depth=1
MVec=3
MVecScaleX=1.0
MVecScaleY=1.0
MVecDX=0.0
MVecDY=0.0
DepthInverted=1
CopyQueue=2
Calib=2
MvecFromEval=1
JitterComp=0

; RingWindow=1 settled by measurement: zero DROPPED, zero REORDERED, zero
; STALE across 16,958 frames, against 3011 fault lines with it off.
RingWindow=1
Stride=0

; ---- neural stage ----
Neural=1
Passes=1
Intensity=2.00
PassReset=0
Tuning=0
ToneStrength=1.0
StructureStrength=1.0
SkinStrength=1.0
Style=0.0
AutoMask=1
Subrect=100
CostCurve=0

; ---- super resolution ----
; SRSnippet=1 loads the DRIVER's nvngx_dlss.dll rather than the game's. That
; is a different module instance from the one the title already initialised,
; which is why SR has been working while neural rendering crashed. If no
; driver copy is found the add-on looks for its own in the mgpu folder, and
; only then falls back to the game's - with a warning, because that is the
; arrangement that faults.
SRUpscale=1
SRSnippet=1
SRPreset=0
SRQuality=2

; R - the resolution neural rendering actually runs at, as a percent of the
; display per axis. This is what the panel's modes write, using DLSS's own
; ladder: quality 67, balanced 58, performance 50.
;
; SRScale=0 would mean "inherit R from the game's render extent", which does
; nothing at all on a title rendering at native - four of the five titles
; measured 2026-09-13 were in exactly that state, so the whole DLSS section
; of the panel did nothing on them. Choosing R ourselves is what makes the
; modes mean the same thing on every title whatever the game's DLSS is set to.
;
; SRMvLowRes RIDES WITH THE SCALE. The flag without the scale is the
; combination that returned FAIL_PlatformError. They are one setting.
SRScale=67
SRMvLowRes=1

; ---- latency ----
; 0.3.0. The driver mode is per-device and outlives the process, so a crash
; leaves it set. The add-on writes ReflexApplied and clears the residue on the
; next launch, but the toggle stays out of 0.2.0's panel.
Reflex=0
ReflexSleep=0
ReflexLatency=0

; ---- automatic quality. 0.3.0, never run. ----
Auto=0
AutoTargetFps=60

; ---- the run ----
AutoArm=1
Frames=0

; ---- window ----
Present=nr
Window=FIT
Monitor=auto
; NoActivate=2 auto-detects duplicate/clone display mode and stops the bridge
; window stealing input. 0 off, 1 force, 2 auto.
NoActivate=2

; ---- probes. All off: they answer questions this run is not asking. ----
MetaProbe=off
MetaProbeLogSeconds=3
MVecProbe=0
MVecProbeIndex=0
DepthCompare=0
Probes=0
Profile=0

; ---- crash-recovery bookkeeping. The add-on owns these. Leave at 0. ----
ArmCrashed=0
ReflexApplied=0
